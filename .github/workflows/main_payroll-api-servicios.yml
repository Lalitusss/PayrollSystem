# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - payroll-api-servicios

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        # CORRECCIÓN: Apuntamos al proyecto específico de la API
        run: dotnet build ./Payroll.API/Payroll.API.csproj --configuration Release

      - name: dotnet publish
        # CORRECCIÓN: Publicamos el proyecto de la API
        run: dotnet publish ./Payroll.API/Payroll.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_42838C67FA5847BA91D069C6BB92DCDA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3178C07EA9D247A7BB6EC5AF8BF2B556 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4C8290EDDDD34FC9B5FFF3DDBF7EF912 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'payroll-api-servicios'
          slot-name: 'Production'
          package: .
